name: Automated Test Build

on:
  push:
    branches: [ "master", "dev-ygoexpert" ]
  pull_request:
    branches: [ "master", "dev-ygoexpert" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Publish
      run: |
        dotnet publish WindBot.csproj -c Release -o dist/WindBot
        dotnet publish BotWrapper/BotWrapper.csproj -c Release -o dist

    - name: Pack
      run: |
        cd dist
        7z a WindBot.7z *
        cd ..

    - name: Upload build artifacts
      uses: actions/upload-artifact@v6
      with:
        path: dist\WindBot.7z

    - name: GitHub Release
      if: github.event_name == 'push'
      uses: marvinpinto/action-automatic-releases@latest
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: false
        title: "Development Build"
        files: |
          dist/WindBot.7z

  linux-build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6

    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: "10.0.x"

    - name: Publish linux-x64 self-contained
      run: |
        dotnet publish WindBot.csproj -c Release -r linux-x64 --self-contained true -o dist/linux-x64

    - name: Upload Linux build artifacts
      uses: actions/upload-artifact@v6
      with:
        name: WindBot-linux-x64
        path: dist/linux-x64/
        if-no-files-found: error
